name: build-linux-x64-test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'assets/fonts/**'
      - 'build/**'
      - 'tools/**'
      - '.github/workflows/build-linux-x64-test.yml'

permissions:
  actions: read
  contents: read

jobs:
  linux-build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 -m pip install --user pytest
      - name: Validate patch set
        run: python3 tools/check_patches.py
      - name: Run full repository tests
        run: python3 -m pytest -q
