name: release-browser

on:
  workflow_run:
    workflows:
      - build-linux-x64
      - build-linux-arm64
      - build-macos-x64
      - build-macos-arm64
      - build-win-x64-github
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Chromium version whose verified missing platforms should be published (no build retry)'
        required: true
        type: string
        default: '152.0.7977.82'

permissions:
  actions: read
  contents: read

jobs:
  readiness:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      version: ${{ steps.check.outputs.version }}
      controller_sha: ${{ steps.controller.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Record trusted release tooling revision
        id: controller
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release version and triggering source
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 tools/reconcile_browser_release.py --check-ready

  release:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-browser-publish-${{ needs.readiness.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.readiness.outputs.controller_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test release tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*release*.py' -v
      - name: Reconcile verified missing platform ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.readiness.outputs.version }}
        run: python3 tools/reconcile_browser_release.py
