name: release-browser

on:
  workflow_run:
    workflows: [build-cross-platform, build-win-x64-github]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-browser
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Execute trusted release tooling, not code from the triggering run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test release tooling
        run: python -m unittest discover -s tools/tests -p test_release_browser.py -v

      - name: Verify artifacts and publish browser ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_browser.py
