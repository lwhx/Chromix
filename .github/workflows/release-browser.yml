name: release-browser

on:
  workflow_run:
    workflows:
      - build-linux-x64
      - build-linux-arm64
      - build-macos-x64
      - build-macos-arm64
      - build-win-x64-github
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-browser-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  readiness:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      # Use release tooling from the same-repository main build commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check all five platform runs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_browser.py --check-ready

  release:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-browser-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Use release tooling from the same-repository main build commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test release tooling
        run: python3 -m unittest discover -s tools/tests -p test_release_browser.py -v

      - name: Verify artifacts and publish browser ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_browser.py
