name: build-cross-platform

on:
  workflow_dispatch:
    inputs:
      use_upstream_cache:
        description: 'Require pinned full upstream source + out/Default reuse; fail on cache miss (false permits cold builds)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'build/**'
      - 'patches/**'
      - 'assets/fonts/**'
      - 'tools/*upstream_cache.py'
      - 'tools/upstream_object_cache.py'
      - 'tools/upstream_script_identity.py'
      - 'tools/apply_restored_patches.py'
      - 'tools/prepare_restored_build.py'
      - 'tools/restore_ninja.py'
      - 'tools/macos_runtime.py'
      - 'tools/restored_reuse_evidence.py'
      - 'tools/gen_posix_workflow.py'
      - 'tools/merge_gn_args.py'
      - '.github/workflows/build-cross-platform.yml'
      - '.github/workflows/build-posix-github.yml'
      - '.github/workflows/build-win-x64-github.yml'
      - 'CHROMIUM_VERSION'
      - 'UNGOOGLED_VERSION'
      - 'UNGOOGLED_WINDOWS_VERSION'

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-cross-platform-${{ github.ref }}
  cancel-in-progress: false

env:
  CHROMIUM_VERSION: '152.0.7977.82'
  DEPOT_TOOLS_METRICS: '0'
  DEPOT_TOOLS_COLLECT_METRICS: '0'

jobs:
  linux-x64:
    name: Linux x64 (8-stage snapshot/resume)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: linux
      arch: x64
      runner: ubuntu-22.04
      artifact: chromix-linux-x64
      max-stages: 8
      use_upstream_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_upstream_cache }}
    secrets: inherit

  linux-arm64:
    name: Linux arm64 (8-stage snapshot/resume)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: linux
      arch: arm64
      runner: ubuntu-24.04-arm
      artifact: chromix-linux-arm64
      max-stages: 8
      use_upstream_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_upstream_cache }}
    secrets: inherit

  macos-intel:
    name: macOS Intel (8-stage snapshot/resume)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: macos
      arch: x64
      runner: macos-15-intel
      artifact: chromix-mac-x64
      max-stages: 8
      use_upstream_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_upstream_cache }}
    secrets: inherit

  macos-apple-silicon:
    name: macOS Apple Silicon (8-stage snapshot/resume)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: macos
      arch: arm64
      runner: macos-15
      artifact: chromix-mac-arm64
      max-stages: 8
      use_upstream_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_upstream_cache }}
    secrets: inherit

  windows-x64:
    name: Windows x64 (12-stage snapshot/resume)
    uses: ./.github/workflows/build-win-x64-github.yml
    with:
      use_upstream_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_upstream_cache }}
    secrets: inherit
