name: build-macos-x64

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'ThinLTO optimization profile'
        type: choice
        options: [fast, release]
        default: fast
      build_mode:
        description: 'Staged snapshot/resume or a single job that must finish'
        type: choice
        options: [staged, single]
        default: staged
      use_upstream_cache:
        description: 'Require pinned full upstream source + out/Default reuse; false permits cold builds'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'build/*'
      - 'build/macos/**'
      - 'build/posix/**'
      - 'patches/**'
      - 'assets/fonts/**'
      - 'tools/*upstream_cache.py'
      - 'tools/upstream_object_cache.py'
      - 'tools/upstream_script_identity.py'
      - 'tools/apply_restored_patches.py'
      - 'tools/prepare_restored_build.py'
      - 'tools/restore_ninja.py'
      - 'tools/bootstrap_gn.py'
      - 'tools/macos_runtime.py'
      - 'tools/restored_reuse_evidence.py'
      - 'sdk/python/chromix/_binary.py'
      - 'tools/gen_posix_workflow.py'
      - 'tools/merge_gn_args.py'
      - '.github/workflows/build-macos-x64.yml'
      - '.github/workflows/build-posix-github.yml'
      - 'CHROMIUM_VERSION'
      - 'UNGOOGLED_VERSION'

permissions:
  actions: read
  contents: read

concurrency:
  group: build-macos-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS Intel (8-stage snapshot/resume)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: macos
      arch: x64
      runner: macos-15-intel
      artifact: chromix-mac-x64
      max-stages: ${{ inputs.build_mode == 'single' && 1 || 8 }}
      build_profile: ${{ inputs.build_profile || 'fast' }}
      use_upstream_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_upstream_cache }}
    secrets: inherit
