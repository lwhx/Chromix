        if: success() && steps.stage.outputs.upload_snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s7-attempt-${{ github.run_attempt }}-part1
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-7/p1/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - name: Upload tree part 2
        if: success() && steps.stage.outputs.upload_snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s7-attempt-${{ github.run_attempt }}-part2
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-7/p2/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - name: Upload tree part 3
