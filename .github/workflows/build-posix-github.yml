          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - name: Upload tree part 3
        if: success() && steps.stage.outputs.upload_snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s2-attempt-${{ github.run_attempt }}-part3
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-2/p3/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - name: Upload tree part 4
        if: success() && steps.stage.outputs.upload_snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s2-attempt-${{ github.run_attempt }}-part4
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-2/p4/
